name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BINARYEN_VERSION: 132
  BINARYEN_LINUX_X86_64_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572

jobs:
  verify:
    name: Verify release sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: wasm-plugin

      - uses: typst-community/setup-typst@63ac138db421d586de61f7f5ac3bcef6a2e6c78c # v5.1.0
        with:
          typst-versions-yaml: |
            typst-min:
              version: 0.14.0
            typst-latest:
              version: latest

      - name: Match tag to package and WASM versions
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' package/typst.toml)"
          wasm_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' wasm-plugin/Cargo.toml)"

          fail() {
            printf '::error::%s\n' "$1" >&2
            exit 1
          }

          test -n "$package_version" || fail "Could not read the Typst package version"
          test -n "$wasm_version" || fail "Could not read the WASM workspace version"
          test "$package_version" = "$wasm_version" || \
            fail "Typst ${package_version} does not match WASM ${wasm_version}"
          test "v${package_version}" = "$GITHUB_REF_NAME" || \
            fail "Tag ${GITHUB_REF_NAME} does not match package ${package_version}"

          printf 'release version verified: %s\n' "$package_version"

      - name: Install WASM validation tools
        run: cargo install wasm-tools --locked --version 1.245.1

      - name: Install pinned Binaryen
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/binaryen.tar.gz
          curl --fail --location \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$BINARYEN_LINUX_X86_64_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C /tmp
          printf '/tmp/binaryen-version_%s/bin\n' "$BINARYEN_VERSION" >> "$GITHUB_PATH"

      - name: Install pinned scientific validation tools
        run: |
          python3 -m venv /tmp/axodendron-scientific-validation
          /tmp/axodendron-scientific-validation/bin/python -m pip install \
            --disable-pip-version-check \
            neurom==4.0.5 \
            pylmeasure==0.2.0

      - name: Recompute upstream fixtures
        run: /tmp/axodendron-scientific-validation/bin/python scripts/check-upstream-cross-validation.py

      - name: Verify minimum-version release sources
        run: TYPST_BIN=typst-min AXODENDRON_BENCH_FULL=1 ./scripts/check.sh

      - name: Verify committed WASM is reproducible
        run: git diff --exit-code -- package/plugin.wasm

      - name: Verify package with latest Typst
        run: TYPST_BIN=typst-latest ./scripts/check-package.sh

  typst-package:
    name: Package release assets
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: typst-community/setup-typst@63ac138db421d586de61f7f5ac3bcef6a2e6c78c # v5.1.0
        with:
          typst-versions-yaml: |
            typst-docs:
              version: 0.14.2

      - name: Compile manual
        working-directory: package
        run: typst-docs compile --root .. docs/documentation.typ

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' package/typst.toml)"
          test -n "$package_version"
          test "v${package_version}" = "$GITHUB_REF_NAME"

          mkdir -p release-assets typst-dist/axodendron wasm-dist/axodendron-wasm-plugin
          cp -a package/. typst-dist/axodendron/
          cp package/plugin.wasm LICENSE package/THIRD_PARTY_NOTICES.md wasm-dist/axodendron-wasm-plugin/

          test -f typst-dist/axodendron/docs/documentation.pdf
          test -f wasm-dist/axodendron-wasm-plugin/plugin.wasm

          (
            cd typst-dist
            zip -qr "../release-assets/axodendron-typst-${package_version}.zip" axodendron
          )

          (
            cd wasm-dist
            zip -qr "../release-assets/axodendron-wasm-plugin-${package_version}.zip" axodendron-wasm-plugin
          )

          cp package/docs/documentation.pdf "release-assets/axodendron-manual-${package_version}.pdf"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: typst-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi

  deploy-docs:
    name: Deploy documentation
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify Vercel credentials
        shell: bash
        run: |
          set -euo pipefail

          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [[ -z "${!name}" ]]; then
              printf '::error::Missing repository secret %s\n' "$name" >&2
              exit 1
            fi
          done

      - name: Install Vercel CLI
        run: npm install --global vercel@58.5.1

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build documentation
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy documentation
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
